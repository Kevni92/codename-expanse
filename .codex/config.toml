# Project-scoped Codex multi-agent configuration for Codename Expanse.
# GPT-5.6 in Codex requires a sufficiently recent Codex build (0.144.0+).

[agents]
enabled = true
max_concurrent_threads_per_session = 6
max_depth = 1

[agents.orchestrator]
description = "Coordinates the complete Codename Expanse workflow and delegates dependent stages to specialist agents."
config_file = "./agents/orchestrator.toml"
nickname_candidates = ["Orchestrator"]

[agents.concept_writer]
description = "Creates and maintains normative gameplay/system concept documents."
config_file = "./agents/concept-writer.toml"
nickname_candidates = ["Concept Writer"]

[agents.technical_architect]
description = "Turns approved concepts into implementation-grade technical architecture."
config_file = "./agents/technical-architect.toml"
nickname_candidates = ["Technical Architect"]

[agents.planner]
description = "Transforms approved concepts and architecture into small implementation-ready GitHub Issues."
config_file = "./agents/planner.toml"
nickname_candidates = ["Planner"]

[agents.implementer]
description = "Implements exactly one scoped issue at a time with tests and no architecture invention."
config_file = "./agents/implementer.toml"
nickname_candidates = ["Implementer"]

[agents.code_reviewer]
description = "Reviews pull requests against issues, concepts, architecture, ADRs and project standards."
config_file = "./agents/code-reviewer.toml"
nickname_candidates = ["Code Reviewer"]

[agents.qa_verifier]
description = "Verifies acceptance criteria, regression coverage and required checks after review fixes."
config_file = "./agents/qa-verifier.toml"
nickname_candidates = ["QA Verifier"]
