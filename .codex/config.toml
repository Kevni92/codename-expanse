# Project-scoped Codex multi-agent configuration for Codename Expanse.
# Gameplay concepts are authored in ChatGPT before the normal Codex workflow begins.

[agents]
enabled = true
max_concurrent_threads_per_session = 6
max_depth = 1

[agents.orchestrator]
description = "Coordinates the Codename Expanse technical delivery workflow from an approved gameplay concept through architecture, issues, implementation, review and QA."
config_file = "./agents/orchestrator.toml"
nickname_candidates = ["Orchestrator"]

[agents.technical_architect]
description = "Turns approved gameplay concepts into implementation-grade technical architecture without changing gameplay intent."
config_file = "./agents/technical-architect.toml"
nickname_candidates = ["Technical Architect"]

[agents.planner]
description = "Transforms approved gameplay concepts and technical architecture into small implementation-ready GitHub Issues."
config_file = "./agents/planner.toml"
nickname_candidates = ["Planner"]

[agents.implementer]
description = "Implements exactly one scoped issue at a time with tests and no gameplay or architecture invention."
config_file = "./agents/implementer.toml"
nickname_candidates = ["Implementer"]

[agents.code_reviewer]
description = "Reviews pull requests against issues, gameplay concepts, architecture, ADRs and project standards."
config_file = "./agents/code-reviewer.toml"
nickname_candidates = ["Code Reviewer"]

[agents.qa_verifier]
description = "Verifies acceptance criteria, regression coverage and required checks after review fixes."
config_file = "./agents/qa-verifier.toml"
nickname_candidates = ["QA Verifier"]
